# Currency every quote is reported in.
currency = "USD"

# Category names a BOM row may use; one worker runs per category.
categories = ["fasteners", "bearings", "motion", "motors", "electronics", "other"]

# McMaster-Carr: industrial hardware.
[[suppliers]]
# Name written to the CBOM vendor column.
name = "McMaster-Carr"
# Domains the worker may search and fetch.
domains = ["mcmaster.com"]
# Categories this supplier is searched for (fasteners, bearings, other dropped 2026-09-26: 0 wins on Arctos).
categories = ["motion"]

